<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta | Eric Nguyen</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script type="module" src="main.js"></script>
</head>
<body>
    <h1>Meta</h1>
    <p>
        This page analyzes the code behind this website: how many lines it has,
        which languages it uses, and when I wrote it. Scroll down to watch it grow.
    </p>

    <div id="stats"></div>

    <h2>Commits by time of day</h2>

    <div id="scrolly-1">
        <div id="scatter-story"></div>
        <div id="scatter-plot">
            <p class="progress">Commits through <time id="commit-max-time"></time></p>
            <div id="chart"></div>
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>

    <h2>Files by size</h2>

    <div id="scrolly-2">
        <div id="file-story"></div>
        <div id="file-plot">
            <p class="progress">Code written through <time id="file-max-time"></time></p>
            <dl id="files"></dl>
        </div>
    </div>

    <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd><a href="" id="commit-link" target="_blank"></a></dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <dt>Time</dt>
    <dd id="commit-time"></dd>

    <dt>Author</dt>
    <dd id="commit-author"></dd>

    <dt>Lines edited</dt>
    <dd id="commit-lines"></dd>
    </dl>

</body>
</html>
